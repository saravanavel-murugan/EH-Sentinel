<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{rx:8;ry:8;stroke:#2b6cb0;stroke-width:1.5;fill:#ebf4ff;}
      .src{fill:#f0fff4;stroke:#2f855a;}
      .coord{fill:#fffaf0;stroke:#c05621;}
      .policy{fill:#fff5f5;stroke:#c53030;}
      .out{fill:#faf5ff;stroke:#6b46c1;}
      .llm{fill:#edf2f7;stroke:#4a5568;stroke-dasharray:4 3;}
      .lbl{font-size:12px;fill:#1a202c;}
      .hdr{font-size:13px;font-weight:bold;fill:#1a202c;}
      .edge{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#arrow);}
      .dash{stroke:#888;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#arrow);}
      .title{font-size:16px;font-weight:bold;fill:#1a202c;}
    </style>
  </defs>

  <text x="24" y="28" class="title">EventHub Ops – Sentinel : High-Level Architecture (A1–A8, LangGraph)</text>

  <!-- sources -->
  <rect x="24" y="50" width="240" height="120" class="box src"/>
  <text x="34" y="70" class="hdr">Telemetry &amp; context sources</text>
  <text x="34" y="90" class="lbl">• Confluent / Control Center</text>
  <text x="34" y="108" class="lbl">• Prometheus / Grafana / APM</text>
  <text x="34" y="126" class="lbl">• Kafka Connect / Schema Registry</text>
  <text x="34" y="144" class="lbl">• Logs: ELK / OpenSearch / Splunk</text>
  <text x="34" y="162" class="lbl">• CMDB / catalogue / on-call</text>

  <!-- ingestion chain -->
  <rect x="300" y="50" width="300" height="34" class="box"/>
  <text x="310" y="72" class="lbl">Secure adapters: ingest + validate + redact</text>
  <rect x="300" y="98" width="300" height="34" class="box"/>
  <text x="310" y="120" class="lbl">Normalize to canonical signal + dedupe</text>
  <rect x="300" y="146" width="300" height="42" class="box"/>
  <text x="310" y="164" class="lbl">Deterministic anomaly gate + grounding</text>
  <text x="310" y="180" class="lbl">(rules + entity/business table)</text>

  <line x1="264" y1="110" x2="300" y2="67" class="edge"/>
  <line x1="450" y1="84" x2="450" y2="98" class="edge"/>
  <line x1="450" y1="132" x2="450" y2="146" class="edge"/>

  <!-- coordinator -->
  <rect x="300" y="210" width="430" height="300" class="box coord"/>
  <text x="312" y="230" class="hdr">Multi-agent coordinator (LangGraph, bounded)</text>
  <line x1="450" y1="188" x2="450" y2="210" class="edge"/>

  <!-- agent nodes stacked -->
  <g>
    <rect x="320" y="244" width="300" height="26" class="box"/><text x="330" y="262" class="lbl">A1 Signal Validation / Anomaly Triage</text>
    <rect x="320" y="276" width="300" height="26" class="box"/><text x="330" y="294" class="lbl">A2 Correlation &amp; Topology</text>
    <rect x="320" y="308" width="300" height="26" class="box"/><text x="330" y="326" class="lbl">A3 Severity &amp; Business Impact</text>
    <rect x="320" y="340" width="300" height="26" class="box"/><text x="330" y="358" class="lbl">A4 Root-Cause Hypothesis</text>
    <rect x="320" y="372" width="300" height="26" class="box"/><text x="330" y="390" class="lbl">A5 Remediation Recommendation</text>
    <rect x="320" y="404" width="300" height="26" class="box"/><text x="330" y="422" class="lbl">A6 Incident Summary &amp; Ticket</text>
    <rect x="320" y="436" width="300" height="26" class="box"/><text x="330" y="454" class="lbl">A7 Stakeholder Communication &amp; Escalation</text>
    <rect x="320" y="468" width="300" height="26" class="box"/><text x="330" y="486" class="lbl">A8 Recovery Verification &amp; Feedback</text>
  </g>
  <!-- vertical flow arrows between agents -->
  <line x1="470" y1="270" x2="470" y2="276" class="edge"/>
  <line x1="470" y1="302" x2="470" y2="308" class="edge"/>
  <line x1="470" y1="334" x2="470" y2="340" class="edge"/>
  <line x1="470" y1="366" x2="470" y2="372" class="edge"/>
  <line x1="470" y1="398" x2="470" y2="404" class="edge"/>
  <line x1="470" y1="430" x2="470" y2="436" class="edge"/>
  <line x1="470" y1="462" x2="470" y2="468" class="edge"/>

  <!-- watch state (A1 gate) -->
  <rect x="648" y="244" width="72" height="40" class="box policy"/>
  <text x="656" y="262" class="lbl">Watch</text>
  <text x="656" y="277" class="lbl">state</text>
  <path d="M620,257 H648" class="dash"/>
  <text x="624" y="240" class="lbl" font-size="10">noise/insuff.</text>

  <!-- llm -->
  <rect x="750" y="330" width="186" height="60" class="box llm"/>
  <text x="760" y="352" class="lbl">LLM provider</text>
  <text x="760" y="370" class="lbl">ChatOpenAI / offline fake</text>
  <text x="760" y="386" class="lbl" font-size="10">reasons for the agents</text>
  <path d="M750,360 H730" class="dash"/>

  <!-- policy gate -->
  <rect x="300" y="530" width="430" height="40" class="box policy"/>
  <text x="312" y="548" class="lbl">Policy / safety gate + human approval</text>
  <text x="312" y="564" class="lbl" font-size="10">read-only by default; A5 actions require approval</text>
  <line x1="450" y1="510" x2="450" y2="530" class="edge"/>

  <!-- outputs -->
  <rect x="300" y="596" width="430" height="90" class="box out"/>
  <text x="312" y="616" class="hdr">Outputs</text>
  <text x="312" y="636" class="lbl">• ITSM ticket (idempotent)</text>
  <text x="312" y="654" class="lbl">• Stakeholder notifications (approved recipients only)</text>
  <text x="312" y="672" class="lbl">• Operator dashboard</text>
  <line x1="450" y1="570" x2="450" y2="596" class="edge"/>

  <!-- audit -->
  <rect x="760" y="530" width="176" height="60" class="box"/>
  <text x="770" y="552" class="lbl">Audit store +</text>
  <text x="770" y="570" class="lbl">evaluation feedback</text>
  <path d="M730,480 C760,500 760,510 790,530" class="dash"/>
</svg>
